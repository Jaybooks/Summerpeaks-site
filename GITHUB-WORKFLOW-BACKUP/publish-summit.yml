name: Publish scheduled Summit article

on:
  schedule:
    # 5:05 AM Arizona (America/Phoenix) = 12:05 UTC year-round.
    - cron: '5 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: summit-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish due Summit content
        run: python scripts/publish_summit.py

      - name: Commit published content
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Summit article is due."
            exit 0
          fi
          git config user.name "summer-peaks-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add summit/articles summit/articles.json summit/publish-queue.json summit/scheduled sitemap.xml
          git commit -m "Publish scheduled Summit article"
          git push
